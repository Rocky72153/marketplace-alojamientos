spring:
  datasource:
    # Each Spring application context gets its own database; create-drop in one
    # context must not drop tables used by another cached context.
    url: jdbc:h2:mem:marketplace_${random.uuid};DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
app:
  security:
    jwt-secret: test-only-secret-key-that-is-long-enough-for-hmac-sha256
    admin-bootstrap-key: bootstrap-key-for-tests
