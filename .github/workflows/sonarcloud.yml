name: SonarCloud Quality Gate

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarcloud-analysis:
    # Configura estas variables cuando el proyecto exista en SonarQube Cloud.
    # El secreto SONAR_TOKEN se valida al iniciar el job.
    if: vars.SONAR_ORGANIZATION != '' && vars.SONAR_PROJECT_KEY != ''
    name: SonarCloud Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que exista el token de SonarCloud
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -z "${SONAR_TOKEN}" ]]; then
            echo "::error::Falta el secreto SONAR_TOKEN. Créalo en Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi

      - name: Obtener todo el historial
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y verificar backend
        run: mvn -B -ntp -f backend/pom.xml verify

      - name: Analizar y esperar Quality Gate de SonarCloud
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
