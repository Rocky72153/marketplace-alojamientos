name: SonarCloud Quality Gate

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarcloud-analysis:
    name: SonarCloud Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Obtener todo el historial
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verificar backend y generar clases
        run: mvn -B -ntp -f backend/pom.xml verify
      - name: Configurar Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar frontend y ejecutar pruebas
        working-directory: frontend
        run: npm ci && npm test && npm run build
      - name: Analizar y esperar Quality Gate de SonarCloud
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
