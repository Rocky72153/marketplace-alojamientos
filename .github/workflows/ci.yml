name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v7
      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar y ejecutar pruebas
        run: mvn -B -ntp -f backend/pom.xml verify

  frontend-checks:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v7
      - name: Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias reproducibles
        working-directory: frontend
        run: npm ci
      - name: Verificar estructura y referencias
        working-directory: frontend
        run: npm run lint
      - name: Ejecutar pruebas
        working-directory: frontend
        run: npm test
      - name: Construir frontend
        working-directory: frontend
        run: npm run build

  documentation-checks:
    name: Documentation CI
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v7
      - name: Configurar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Instalar validador YAML
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Validar documentación, BPMN, OpenAPI, trazabilidad y enlaces
        run: python scripts/validate_delivery_docs.py
