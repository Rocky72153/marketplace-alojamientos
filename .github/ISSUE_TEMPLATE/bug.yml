name: Reporte de defecto
description: Reportar un comportamiento incorrecto.
title: "[BUG] "
labels: ["bug"]
body:
  - type: input
    id: jira
    attributes:
      label: Historia o tarea relacionada
      description: Clave o enlace de Jira, si existe.
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportamiento observado
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Pasos para reproducir
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia o logs
