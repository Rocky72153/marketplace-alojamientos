openapi: 3.1.0
info:
  title: Marketplace Alojamientos API
  version: 0.1.0
  description: >-
    Contrato inicial propuesto para revisión en la Entrega 1. Describe capacidades
    del MVP académico; todavía no implica que todas las operaciones estén implementadas.
    Los enums usan valores serializados en inglés: roles GUEST=HUÉSPED, HOST=ANFITRIÓN,
    ADMIN=ADMINISTRADOR; estados de publicación DRAFT=BORRADOR,
    PENDING_REVIEW=PENDIENTE_REVISION, ACTIVE=ACTIVA, PAUSED=PAUSADA y
    BLOCKED=BLOQUEADA. En Booking.state, REQUESTED=SOLICITADA,
    CONFIRMED=CONFIRMADA, CANCELLED=CANCELADA, COMPLETED=COMPLETADA,
    REJECTED=RECHAZADA, PENDING_PAYMENT=PAGO_PENDIENTE y
    PAYMENT_FAILED=PAGO_FALLIDO.
servers:
  - url: http://localhost:8080/api
    description: Entorno local
security:
  - bearerAuth: []
tags:
  - name: Identidad
  - name: Perfil
  - name: Publicaciones
  - name: Disponibilidad
  - name: Búsqueda y cotización
  - name: Reservas
  - name: Notificaciones
  - name: Reseñas
  - name: Administración
paths:
  /auth/register:
    post:
      tags: [Identidad]
      security: []
      summary: Registrar usuario
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { description: Cuenta creada, estado inicial informado }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { description: Correo ya registrado }
  /auth/login:
    post:
      tags: [Identidad]
      security: []
      summary: Iniciar sesión
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sesión creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { description: Credenciales inválidas o cuenta deshabilitada }
  /auth/recovery:
    post:
      tags: [Identidad]
      security: []
      summary: Solicitar recuperación simulada
      operationId: simulatePasswordRecovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Confirmación neutral; no revela si el correo está registrado }
        '400': { $ref: '#/components/responses/ValidationError' }
  /profile/me:
    get:
      tags: [Perfil]
      summary: Consultar perfil propio
      operationId: getMyProfile
      responses:
        '200':
          description: Perfil del usuario autenticado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Perfil]
      summary: Actualizar datos básicos
      operationId: updateMyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200': { description: Perfil actualizado }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /listings:
    get:
      tags: [Publicaciones]
      security: []
      summary: Buscar publicaciones activas
      operationId: searchListings
      parameters:
        - { name: city, in: query, schema: { type: string } }
        - { name: checkIn, in: query, schema: { type: string, format: date } }
        - { name: checkOut, in: query, schema: { type: string, format: date } }
        - { name: guests, in: query, schema: { type: integer, minimum: 1 } }
        - { name: type, in: query, schema: { type: string } }
        - { name: minPrice, in: query, schema: { type: number, minimum: 0 } }
        - { name: maxPrice, in: query, schema: { type: number, minimum: 0 } }
        - { name: amenityIds, in: query, description: IDs separados por coma; confirmar convención, schema: { type: string } }
      responses:
        '200':
          description: Resultados paginados y activos; disponibilidad validada cuando se especifican fechas
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ListingSummary' } }
                  total: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Publicaciones]
      summary: Crear publicación como anfitrión
      operationId: createListing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingInput' }
      responses:
        '201': { description: Borrador creado y asociado al anfitrión autenticado }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Rol no autorizado }
  /listings/{listingId}:
    parameters:
      - { $ref: '#/components/parameters/ListingId' }
    get:
      tags: [Publicaciones]
      security: []
      summary: Consultar detalle público
      operationId: getListing
      responses:
        '200':
          description: Detalle de la publicación activa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingDetail' }
        '404': { description: No existe publicación pública con ese identificador }
    patch:
      tags: [Publicaciones]
      summary: Editar publicación propia
      operationId: updateListing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingInput' }
      responses:
        '200': { description: Publicación actualizada con estado coherente }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { description: El usuario no es propietario ni administrador autorizado }
        '404': { description: Publicación no encontrada }
  /listings/{listingId}/state:
    parameters:
      - { $ref: '#/components/parameters/ListingId' }
    patch:
      tags: [Publicaciones]
      summary: Cambiar estado de publicación
      operationId: changeListingState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { $ref: '#/components/schemas/ListingState' }
                reason: { type: string, maxLength: 1000 }
      responses:
        '200': { description: Estado cambiado y evento auditado }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { description: Transición o rol no permitido }
  /listings/{listingId}/availability:
    parameters:
      - { $ref: '#/components/parameters/ListingId' }
    get:
      tags: [Disponibilidad]
      security: []
      summary: Consultar periodos disponibles/reservados
      operationId: getAvailability
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Periodos del alojamiento en el rango consultado
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AvailabilityPeriod' }
        '400': { $ref: '#/components/responses/ValidationError' }
    put:
      tags: [Disponibilidad]
      summary: Definir periodos del calendario propio
      operationId: updateAvailability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/AvailabilityPeriodInput' }
      responses:
        '200': { description: Calendario actualizado sin contradecir reservas confirmadas }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { description: El usuario no es anfitrión propietario }
  /quotes:
    post:
      tags: [Búsqueda y cotización]
      security: []
      summary: Calcular cotización desglosada
      operationId: createQuote
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
      responses:
        '200':
          description: Cotización informativa, no reserva confirmada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { description: Publicación o fechas no disponibles para cotizar }
  /bookings:
    post:
      tags: [Reservas]
      summary: Solicitar reserva inmediata e idempotente
      operationId: createBooking
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quoteId]
              properties:
                quoteId: { type: string, format: uuid }
      responses:
        '201':
          description: Reserva aceptada según las reglas de confirmación y el resultado simulado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Conflicto de disponibilidad o solicitud idempotente incompatible }
        '502': { description: Error con proveedor de pago de pruebas; comportamiento de recuperación por acordar }
    get:
      tags: [Reservas]
      summary: Consultar historial propio
      operationId: listMyBookings
      parameters:
        - { name: state, in: query, schema: { type: string } }
      responses:
        '200':
          description: Reservas visibles para el usuario autenticado
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Booking' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /bookings/{bookingId}:
    parameters:
      - { name: bookingId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Reservas]
      summary: Consultar reserva propia o autorizada
      operationId: getBooking
      responses:
        '200':
          description: Reserva con cotización aceptada y estado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '403': { description: Reserva ajena sin permiso }
        '404': { description: Reserva inexistente }
  /bookings/{bookingId}/cancel:
    post:
      tags: [Reservas]
      summary: Cancelar reserva aplicando política asociada
      operationId: cancelBooking
      parameters:
        - { name: bookingId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200':
          description: Cancelación trazada con devolución simulada y estado final
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cancellation' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { description: No es huésped titular ni actor autorizado }
        '409': { description: Reserva no cancelable bajo el estado/política vigentes }
  /notifications:
    get:
      tags: [Notificaciones]
      summary: Consultar notificaciones propias
      operationId: listNotifications
      responses:
        '200':
          description: Lista de notificaciones para el usuario autenticado
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /listings/{listingId}/reviews:
    get:
      tags: [Reseñas]
      security: []
      summary: Consultar reseñas visibles de una publicación
      operationId: listListingReviews
      parameters:
        - { $ref: '#/components/parameters/ListingId' }
      responses:
        '200':
          description: Reseñas visibles conforme a moderación
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Review' } }
    post:
      tags: [Reseñas]
      summary: Crear reseña de reserva completada
      operationId: createReview
      parameters:
        - { $ref: '#/components/parameters/ListingId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookingId, rating, content]
              properties:
                bookingId: { type: string, format: uuid }
                rating: { type: integer, minimum: 1, maximum: 5, description: Rango propuesto para validación del equipo }
                content: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        '201': { description: Reseña asociada a huésped, reserva y alojamiento }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { description: Reserva no pertenece al usuario o no está completada }
        '409': { description: Ya existe una reseña para la reserva }
  /admin/audit-events:
    get:
      tags: [Administración]
      summary: Consultar eventos de auditoría
      operationId: listAuditEvents
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: eventType, in: query, schema: { type: string } }
      responses:
        '200': { description: Eventos filtrados, solo para administradores autorizados }
        '403': { description: Rol no autorizado }
  /admin/dashboard:
    get:
      tags: [Administración]
      summary: Consultar indicadores básicos
      operationId: getDashboard
      responses:
        '200':
          description: Usuarios, publicaciones activas, reservas por estado, ingresos estimados y ciudades de mayor demanda
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '403': { description: Rol no autorizado }
  /admin/reports:
    post:
      tags: [Administración]
      summary: Generar reporte PDF o Excel
      operationId: exportReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, format]
              properties:
                type: { type: string, enum: [users, listings, bookings, estimated-revenue, demand] }
                format: { type: string, enum: [PDF, XLSX] }
                filters: { type: object, additionalProperties: true }
      responses:
        '202': { description: Reporte solicitado; registrar solicitante y fecha de petición }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { description: Rol no autorizado }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ListingId:
      name: listingId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Sesión ausente o inválida
    ValidationError:
      description: Datos de entrada inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password, role]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, writeOnly: true }
        role: { type: string, enum: [GUEST, HOST, ADMIN] }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, writeOnly: true }
    SessionResponse:
      type: object
      required: [accessToken, role]
      properties:
        accessToken: { type: string, writeOnly: true }
        tokenType: { type: string, example: Bearer }
        role: { type: string, enum: [GUEST, HOST, ADMIN] }
        expiresAt: { type: string, format: date-time }
    Profile:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        role: { type: string, enum: [GUEST, HOST, ADMIN] }
        accountState: { type: string, enum: [ACTIVE, DEACTIVATED, RESTRICTED] }
    ProfileUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 120 }
        phone: { type: string, maxLength: 40 }
        photoReference: { type: string, maxLength: 1000 }
    ListingState:
      type: string
      enum: [DRAFT, PENDING_REVIEW, ACTIVE, PAUSED, BLOCKED]
    ListingInput:
      type: object
      required: [title, description, location, type, capacity, pricePerNight]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, minLength: 1, maxLength: 10000 }
        location: { type: string, minLength: 1, maxLength: 300 }
        type: { type: string, maxLength: 60 }
        capacity: { type: integer, minimum: 1 }
        pricePerNight: { type: number, exclusiveMinimum: 0 }
        amenityIds: { type: array, items: { type: string, format: uuid } }
        rules: { type: array, items: { type: string, maxLength: 1000 } }
        imageReferences: { type: array, items: { type: string, maxLength: 1000 } }
    ListingSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        location: { type: string }
        type: { type: string }
        capacity: { type: integer }
        pricePerNight: { type: number }
        currency: { type: string, example: COP }
        imageReference: { type: string }
        averageRating: { type: [number, "null"] }
    ListingDetail:
      allOf:
        - { $ref: '#/components/schemas/ListingSummary' }
        - type: object
          properties:
            description: { type: string }
            amenityIds: { type: array, items: { type: string, format: uuid } }
            rules: { type: array, items: { type: string } }
            imageReferences: { type: array, items: { type: string } }
            cancellationPolicyName: { type: string }
    AvailabilityPeriodInput:
      type: object
      required: [from, to, type]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        type: { type: string, enum: [AVAILABLE, BLOCKED] }
    AvailabilityPeriod:
      allOf:
        - { $ref: '#/components/schemas/AvailabilityPeriodInput' }
        - type: object
          properties:
            reservationId: { type: [string, "null"], format: uuid }
    QuoteRequest:
      type: object
      required: [listingId, checkIn, checkOut, guests]
      properties:
        listingId: { type: string, format: uuid }
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        guests: { type: integer, minimum: 1 }
        additionalServices: { type: array, items: { type: object, properties: { id: { type: string }, quantity: { type: integer, minimum: 1 } } } }
    Quote:
      type: object
      required: [id, nights, baseAmount, cleaningFee, serviceFee, discounts, additionalServicesAmount, total, currency]
      properties:
        id: { type: string, format: uuid }
        nights: { type: integer, minimum: 1 }
        baseAmount: { type: number, minimum: 0 }
        cleaningFee: { type: number, minimum: 0 }
        serviceFee: { type: number, minimum: 0 }
        discounts: { type: number, minimum: 0 }
        additionalServicesAmount: { type: number, minimum: 0 }
        total: { type: number, minimum: 0 }
        currency: { type: string, example: COP }
        calculatedAt: { type: string, format: date-time }
    Booking:
      type: object
      properties:
        id: { type: string, format: uuid }
        listingId: { type: string, format: uuid }
        guestId: { type: string, format: uuid }
        quoteId: { type: string, format: uuid }
        checkIn: { type: string, format: date }
        checkOut: { type: string, format: date }
        state: { type: string, enum: [REQUESTED, CONFIRMED, CANCELLED, COMPLETED, REJECTED, PENDING_PAYMENT, PAYMENT_FAILED] }
        total: { type: number }
        currency: { type: string }
        createdAt: { type: string, format: date-time }
        confirmedAt: { type: [string, "null"], format: date-time }
    Cancellation:
      type: object
      properties:
        id: { type: string, format: uuid }
        bookingId: { type: string, format: uuid }
        requestedBy: { type: string, format: uuid }
        reason: { type: string }
        simulatedRefund: { type: number, minimum: 0 }
        finalState: { type: string }
        requestedAt: { type: string, format: date-time }
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        message: { type: string }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, "null"], format: date-time }
    Review:
      type: object
      properties:
        id: { type: string, format: uuid }
        bookingId: { type: string, format: uuid }
        guestDisplayName: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        content: { type: string }
        createdAt: { type: string, format: date-time }
    Dashboard:
      type: object
      properties:
        usersCount: { type: integer, minimum: 0 }
        activeListingsCount: { type: integer, minimum: 0 }
        bookingsByState: { type: object, additionalProperties: { type: integer, minimum: 0 } }
        estimatedRevenue: { type: number, minimum: 0 }
        topCitiesByDemand: { type: array, items: { type: object, properties: { city: { type: string }, bookings: { type: integer } } } }
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        correlationId: { type: string }
