  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token emitido por register/login; se vuelve a comprobar el estado de la cuenta. No
        usar datos reales en una demostración HTTP.
    StripeSignature:
      type: apiKey
      in: header
      name: Stripe-Signature
      description: Representación OpenAPI del requisito de cabecera, no una clave API estática. El SDK
        verifica la firma HMAC del cuerpo con el secreto de webhook.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Clave lógica no vacía, recortada y de hasta 100 caracteres. Reutilizarla para reintentar
        la misma solicitud; otros datos con la misma clave producen 409.
      schema:
        type: string
        minLength: 1
        maxLength: 100
        pattern: \S
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    PageSize:
      name: size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    FromDate:
      name: from
      in: query
      required: false
      description: Fecha inicial inclusiva en horario de Bogotá; omitir para no limitar.
      schema:
        type: string
        format: date
    ToDate:
      name: to
      in: query
      required: false
      description: Fecha final inclusiva en horario de Bogotá; omitir para no limitar.
      schema:
        type: string
        format: date
  responses:
    Error400:
      description: Entrada inválida o incumplimiento de reglas de negocio.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error401:
      description: Sesión ausente, inválida, desactivada o restringida.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error403:
      description: Rol o propiedad insuficientes para esta operación.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error404:
      description: Recurso no encontrado o no visible para la cuenta.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error409:
      description: Conflicto de disponibilidad, idempotencia, duplicación o estado.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error500:
      description: Error interno; respuesta neutral sin detalles privados.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error503:
      description: Proveedor de prueba/configuración no disponible o evento pendiente de conciliación.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    AccountRole:
      type: string
      enum:
      - GUEST
      - HOST
      - ADMIN
    AccountState:
      type: string
      enum:
      - ACTIVE
      - DEACTIVATED
      - RESTRICTED
    ListingStatus:
      type: string
      enum:
      - DRAFT
      - PENDING_REVIEW
      - ACTIVE
      - PAUSED
      - BLOCKED
    AvailabilityType:
      type: string
      enum:
      - AVAILABLE
      - BLOCKED
      - RESERVED
    ReservationStatus:
      type: string
      enum:
      - PENDING_PAYMENT
      - CONFIRMED
      - CANCELLED
      - COMPLETED
    PaymentMode:
      type: string
      enum:
      - SIMULATED_TEST
      - STRIPE_TEST
    CheckoutStatus:
      type: string
      enum:
      - PREPARING
      - OPEN
      - PAID
      - EXPIRED
      - REFUND_PENDING
      - REFUND_FAILED
      - REFUND_REVIEW
      - REFUNDED
      - CANCELLED
    PaymentStatus:
      type: string
      enum:
      - TEST_APPROVED
      - TEST_PENDING
      - TEST_EXPIRED
      - TEST_REFUNDED
      - TEST_NO_REFUND
      - TEST_REFUND_PENDING
      - TEST_REFUND_FAILED
      - TEST_REFUND_REVIEW
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        correlationId:
          type: string
          format: uuid
      required:
      - code
      - message
      - correlationId
      description: Error del backend; no contiene detalles internos ni credenciales.
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - UP
        application:
          type: string
          enum:
          - marketplace-alojamientos
      required:
      - status
      - application
    PaymentConfig:
      type: object
      properties:
