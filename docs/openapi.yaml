            minLength: 1
            pattern: \S
            maxLength: 80
          uniqueItems: true
        rules:
          type:
          - string
          - 'null'
          maxLength: 2000
        imageReferences:
          type:
          - array
          - 'null'
          items:
            type: string
            minLength: 1
            pattern: \S
            maxLength: 1000
          uniqueItems: true
        extraOptions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ExtraInput'
        cancellationPolicy:
          anyOf:
          - allOf:
            - $ref: '#/components/schemas/CancellationPolicyInput'
          - type: 'null'
      required:
      - title
      - description
      - city
      - location
      - type
      - capacity
      - pricePerNight
      description: Crear inicia DRAFT. PATCH exige de nuevo los campos mínimos; no es un JSON Merge Patch.
        En PATCH, extraOptions/cancellationPolicy ausentes conservan sus términos; extraOptions=[] los
        elimina. Los identificadores de extras deben ser únicos.
    ExtraOption:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        unitPrice:
          type: number
          description: Importe decimal en COP; el servidor redondea a dos decimales.
      required:
      - id
      - name
      - unitPrice
    CancellationPolicy:
