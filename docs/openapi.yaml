          format: int32
          minimum: 0
          default: 0
        partialRefundDays:
          type: integer
          format: int32
          minimum: 0
          default: 0
        partialRefundPercentage:
          type: number
          description: Porcentaje de reembolso parcial, no importe monetario.
          minimum: 0
          maximum: 100
          multipleOf: 0.01
      required:
