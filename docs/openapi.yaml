          maxLength: 36
          description: Si falta o está vacío, se genera un UUID textual.
        name:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 80
        unitPrice:
          type: number
          description: Importe decimal en COP; el servidor redondea a dos decimales.
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
      required:
      - name
      - unitPrice
    CancellationPolicyInput:
      type: object
