openapi: 3.1.0
info:
  title: Marketplace de Alojamientos — API implementada
  version: 1.0.0
  description: Contrato de los controladores Java actuales, no del diseño histórico de Entrega 1. Prefijo
    /api incluido en paths. Solo pagos de prueba; sin correo real. Las rutas Stripe se registran condicionalmente
    en STRIPE_TEST. Se documentan roles y propiedad además del JWT; OpenAPI no sustituye esas comprobaciones
    del servidor. X-Correlation-ID lo genera el backend por solicitud, no se confía en un valor entrante.
    Todos los retornos de creación son 200 salvo reseña (201); el webhook devuelve 200 sin cuerpo. El
    proxy puede responder antes de llegar al backend.
servers:
- url: http://localhost:8080
  description: Backend local; requiere base de datos y configuración de prueba.
- url: /
  description: Mismo origen del frontend cuando el proxy publica /api. El webhook público puede estar
    bloqueado.
tags:
- name: Sistema
- name: Identidad
- name: Perfil
- name: Alojamientos
- name: Disponibilidad
- name: Reservas
- name: Pagos
- name: Notificaciones
- name: Reseñas
- name: Administración
- name: Reportes
security:
- BearerAuth: []
paths:
  /api/health:
    get:
      operationId: getHealth
      tags:
      - Sistema
      summary: Estado del servicio
      responses:
        '200':
          description: Operación completada.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/Error500'
      security: []
      x-source-controller: api/HealthController.java
  /api/payments/config:
    get:
      operationId: getPaymentConfig
      tags:
      - Pagos
      summary: Consultar modo de pago
      responses:
        '200':
          description: Operación completada.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentConfig'
        '503':
          $ref: '#/components/responses/Error503'
        '500':
          $ref: '#/components/responses/Error500'
      description: No devuelve claves ni credenciales.
      security: []
      x-source-controller: booking/PaymentConfigurationController.java
  /api/auth/register:
    post:
      operationId: registerAccount
      tags:
      - Identidad
      summary: Registrar una cuenta y emitir sesión
      responses:
        '200':
          description: Operación completada.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
      description: Sin role se crea GUEST; HOST se permite en registro público. ADMIN requiere clave de
        arranque válida. No se devuelve passwordHash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      parameters:
      - name: X-Admin-Bootstrap
        in: header
        required: false
        schema:
          type: string
        description: 'Solo obligatorio para ADMIN: debe coincidir con la clave de arranque configurada.
          Nunca incluir su valor en documentación ni logs.'
      security: []
      x-source-controller: auth/AuthController.java
  /api/auth/login:
    post:
      operationId: login
      tags:
      - Identidad
      summary: Iniciar sesión
      responses:
        '200':
          description: Operación completada.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '500':
          $ref: '#/components/responses/Error500'
      description: Correo normalizado a minúsculas; cuenta activa y contraseña válida. El mensaje de rechazo
        no revela si existe una cuenta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
      x-source-controller: auth/AuthController.java
  /api/auth/recovery:
    post:
      operationId: requestSimulatedRecovery
      tags:
      - Identidad
      summary: Solicitar recuperación simulada
      responses:
        '200':
          description: Operación completada.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
      description: 'Confirmación neutral: no envía correo ni cambia la contraseña.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryRequest'
      security: []
      x-source-controller: auth/AuthController.java
  /api/profile/me:
    get:
      operationId: getOwnProfile
      tags:
      - Perfil
      summary: Consultar perfil propio
      responses:
        '200':
          description: Operación completada.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
      description: La identidad viene del JWT; no admite un ID de otro usuario.
      x-source-controller: profile/ProfileController.java
    patch:
      operationId: updateOwnProfile
      tags:
      - Perfil
      summary: Actualizar datos del perfil propio
      responses:
        '200':
          description: Operación completada.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      x-source-controller: profile/ProfileController.java
    delete:
      operationId: deactivateOwnAccount
      tags:
      - Perfil
      summary: Desactivar la cuenta propia
      responses:
        '200':
          description: Operación completada.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
      description: No elimina físicamente la cuenta. Invalida su uso autenticado y señala reservas futuras
        del anfitrión para revisión manual.
      x-source-controller: profile/ProfileController.java
  /api/listings:
    get:
      operationId: searchListings
      tags:
      - Alojamientos
      summary: Buscar anuncios activos
      responses:
        '200':
          description: Operación completada.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '500':
          $ref: '#/components/responses/Error500'
      description: Sin paginación de servidor. checkIn/checkOut se proporcionan juntos y salida>llegada;
        minPrice≤maxPrice. Con fechas se exige cobertura disponible sin bloqueos/reservas. Solo anuncios
        activos de anfitriones activos.
      parameters:
      - name: city
        in: query
        required: false
        schema:
          type: string
        description: Coincidencia parcial tolerante a tildes; omitir para cualquier ciudad.
      - name: checkIn
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: checkOut
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: guests
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
      - name: type
        in: query
        required: false
        schema:
          type: string
      - name: minPrice
        in: query
        required: false
        schema:
          type: number
          description: Importe decimal en COP; el servidor redondea a dos decimales.
          minimum: 0
      - name: maxPrice
        in: query
        required: false
        schema:
          type: number
          description: Importe decimal en COP; el servidor redondea a dos decimales.
          minimum: 0
      - name: amenityIds
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
          uniqueItems: true
        style: form
        explode: true
      security: []
      x-source-controller: listing/ListingController.java
    post:
      operationId: createListing
      tags:
      - Alojamientos
      summary: Crear publicación
      responses:
        '200':
          description: Operación completada.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingInput'
      x-required-roles:
      - HOST
      x-source-controller: listing/ListingController.java
  /api/listings/cities:
    get:
      operationId: suggestCities
      tags:
      - Alojamientos
      summary: Sugerir ciudades
      responses:
        '200':
          description: Operación completada.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                maxItems: 10
        '500':
          $ref: '#/components/responses/Error500'
      description: Hasta diez opciones; consulta vacía usa los destinos preferidos que existan en el catálogo
        activo.
      parameters:
      - name: query
        in: query
        required: false
        schema:
          type: string
      security: []
      x-source-controller: listing/ListingController.java
  /api/listings/suggestions:
    get:
      operationId: suggestListings
      tags:
      - Alojamientos
      summary: Sugerencias públicas de alojamientos
      responses:
        '200':
          description: Operación completada.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionsResponse'
        '500':
          $ref: '#/components/responses/Error500'
      description: Hasta ocho publicaciones activas recientes. No garantiza disponibilidad para fechas
        concretas.
      security: []
      x-source-controller: listing/ListingSuggestionController.java
  /api/listings/{listingId}:
    get:
      operationId: getListing
      tags:
      - Alojamientos
      summary: Consultar detalle público o propio
      responses:
        '200':
          description: Operación completada.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
      description: 'Anónimo: anuncio activo de anfitrión activo. JWT de propietario o ADMIN permite consultar
        anuncios no públicos. 404 oculta los demás.'
      security:
      - {}
      - BearerAuth: []
      x-source-controller: listing/ListingController.java
      parameters:
      - name: listingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateListing
      tags:
      - Alojamientos
      summary: Actualizar publicación propia o administrada
      responses:
        '200':
          description: Operación completada.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
      description: Propietario o ADMIN; una publicación BLOCKED no se puede editar. Todos los campos mínimos
        de ListingInput son obligatorios aun usando PATCH.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListingInput'
      x-required-roles:
      - HOST
      - ADMIN
      x-source-controller: listing/ListingController.java
      parameters:
      - name: listingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/listings/{listingId}/state:
    patch:
      operationId: changeListingState
      tags:
      - Alojamientos
      summary: Cambiar estado de publicación
      responses:
        '200':
          description: Operación completada.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
      description: Propietario o ADMIN. BLOCKED exige ADMIN y motivo; conserva las reservas futuras para
        revisión manual.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeStateRequest'
      x-required-roles:
      - HOST
      - ADMIN
      x-source-controller: listing/ListingController.java
      parameters:
      - name: listingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/listings/{listingId}/availability:
    get:
      operationId: getAvailability
      tags:
      - Disponibilidad
      summary: Consultar períodos disponibles o bloqueados
      responses:
        '200':
          description: Operación completada.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailabilityPeriod'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
      description: Misma visibilidad que el detalle. from/to se omiten ambos o se indican juntos; devuelve
        períodos que se solapan con el intervalo.
      parameters:
      - name: listingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Inicio del intervalo consultado; debe acompañar to.
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Fin exclusivo; debe ser posterior a from.
      security:
      - {}
      - BearerAuth: []
      x-source-controller: listing/ListingController.java
    put:
      operationId: replaceAvailability
      tags:
      - Disponibilidad
      summary: Reemplazar períodos editables
      responses:
        '200':
          description: Operación completada.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailabilityPeriod'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
      description: Solo propietario o ADMIN. Protege períodos ya reservados y rechaza intervalos inválidos
        o solapados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityRequest'
      x-required-roles:
      - HOST
      - ADMIN
      x-source-controller: listing/ListingController.java
      parameters:
      - name: listingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/host/listings:
    get:
      operationId: getHostListings
      tags:
      - Alojamientos
      summary: Listar publicaciones propias del anfitrión
      responses:
        '200':
          description: Operación completada.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostListingPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      x-required-roles:
      - HOST
      x-source-controller: listing/HostListingController.java
  /api/listings/{listingId}/quotes:
    post:
      operationId: quoteListing
      tags:
      - Reservas
      summary: Calcular cotización pública
      responses:
        '200':
          description: Operación completada.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
      description: No confirma ni bloquea una reserva. Recalcula importes y comprueba disponibilidad,
        capacidad, fechas y extras.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      security: []
      x-source-controller: booking/ReservationController.java
      parameters:
      - name: listingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /api/reservations:
    post:
      operationId: reserveWithSimulator
      tags:
      - Reservas
      summary: Confirmar reserva con simulador interno
      responses:
        '200':
          description: Operación completada.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
      description: Usar solo SIMULATED_TEST. En STRIPE_TEST, una solicitud nueva falla con PAYMENT_MODE_MISMATCH
        (409); usar Checkout. La misma clave y datos devuelve la reserva previa; otra combinación devuelve
        409. Revalida cuenta, anuncio y calendario bajo bloqueo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationRequest'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      x-required-roles:
      - GUEST
      x-payment-mode: SIMULATED_TEST
      x-source-controller: booking/ReservationController.java
    get:
      operationId: getOwnReservations
      tags:
      - Reservas
      summary: Consultar historial propio
      responses:
        '200':
          description: Operación completada.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
      description: Solo reservas del huésped autenticado. Actualiza estancias completadas cuando checkOut
        es anterior a la fecha actual de Bogotá.
      x-required-roles:
      - GUEST
      x-source-controller: booking/ReservationController.java
  /api/reservations/{reservationId}:
    get:
      operationId: getOwnReservation
      tags:
      - Reservas
      summary: Consultar reserva propia
      responses:
        '200':
          description: Operación completada.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '500':
          $ref: '#/components/responses/Error500'
      description: Una reserva de otro huésped responde 404.
      x-required-roles:
      - GUEST
      x-source-controller: booking/ReservationController.java
      parameters:
      - name: reservationId
