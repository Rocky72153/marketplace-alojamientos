      - createdAt
      - cancellationReason
      - cancelledAt
      - refundPercentage
      - refundAmount
      - reviewed
      description: Reserva propia con desglose aceptado y estado de pago de prueba. El historial no expone
        huéspedes ajenos ni referencias privadas del proveedor.
    Checkout:
      type: object
      properties:
        attemptId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/CheckoutStatus'
        checkoutUrl:
          type:
          - string
          - 'null'
          format: uri
          description: URL completa HTTPS de checkout.stripe.com solo cuando status=OPEN. Conservar query
            y fragmento sin recortarlos.
        expiresAt:
          type: string
          format: date-time
      required:
      - attemptId
      - status
      - checkoutUrl
      - expiresAt
      description: La reserva solo se confirma tras un evento firmado válido. El retorno del navegador
        no acredita el pago. PAID confirma; otros estados requieren seguir la respuesta del servidor.
    StripeWebhookEvent:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        livemode:
          type: boolean
          enum:
          - false
        data:
          type: object
          properties:
            object:
              type: object
              additionalProperties: true
          additionalProperties: true
      description: 'Evento original de Stripe, con su cuerpo sin modificar y firma válida. Esquema deliberadamente
        abierto: el SDK verifica firma, modo test y los campos de Checkout que maneja; no define aquí
        todos los tipos/versiones externos. Se procesan completed, async_payment_succeeded, async_payment_failed
        y expired; otros tipos válidos se ignoran.'
      additionalProperties: true
    Notification:
      type: object
      properties:
