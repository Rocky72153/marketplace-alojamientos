          $ref: '#/components/schemas/PaymentMode'
      required:
      - mode
    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 120
        email:
          type: string
          minLength: 1
          pattern: \S
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 72
          pattern: \S
          description: Además del límite de caracteres de Bean Validation, no puede superar 72 bytes UTF-8
            (bcrypt).
        role:
          anyOf:
          - allOf:
            - $ref: '#/components/schemas/AccountRole'
          - type: 'null'
          default: GUEST
      required:
      - name
      - email
      - password
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          pattern: \S
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 72
          pattern: \S
          description: Además del límite de caracteres de Bean Validation, no puede superar 72 bytes UTF-8
            (bcrypt).
      required:
      - email
      - password
    RecoveryRequest:
      type: object
      properties:
