          minLength: 1
          pattern: \S
          maxLength: 120
        location:
          type: string
          minLength: 1
          pattern: \S
          maxLength: 240
        type:
          type: string
          minLength: 1
          pattern: \S
          description: Texto de tipo; el backend no lo restringe a una enumeración.
          maxLength: 50
        capacity:
          type: integer
          format: int32
          minimum: 1
        pricePerNight:
          type: number
          description: Importe decimal en COP; el servidor redondea a dos decimales.
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
        amenityIds:
          type:
          - array
          - 'null'
          items:
